<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tug‘ilgan yilim 🎉</title>
  <meta name="description" content="Nechinchi yilsan? 2010 — Tug‘ilgan yilim 🎉">
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Canvas for celebration confetti -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Ambient background glow elements -->
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>
  <div class="glow-orb orb-3"></div>

  <!-- Main Card Container -->
  <main class="container">
    <div class="card" id="celebrate-card" role="region" aria-label="Tug'ilgan yil kartasi">
      <div class="badge">
        <span class="badge-dot"></span>
        <span class="badge-text">Nechinchi yilsan?</span>
      </div>

      <div class="year-wrapper">
        <h1 class="year-text">2010</h1>
      </div>

      <p class="subtitle">
        Tug‘ilgan yilim <span class="emoji">🎉</span>
      </p>

      <div class="tap-hint">
        <span>Qaytadan nishonlash uchun bosing ✨</span>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
